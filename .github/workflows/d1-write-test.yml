name: K-PARK D1 Write Test

on:
  workflow_dispatch:

jobs:
  d1-write-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: D1 write test
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute kpark --remote --yes --command "CREATE TABLE IF NOT EXISTS kpark_cloud_test (id INTEGER PRIMARY KEY, note TEXT);"
          npx wrangler d1 execute kpark --remote --yes --command "INSERT OR REPLACE INTO kpark_cloud_test (id,note) VALUES (1,'github-actions-ok');"
          npx wrangler d1 execute kpark --remote --command "SELECT * FROM kpark_cloud_test;"
