name: K-PARK DART Full Sync

on:
  workflow_dispatch:

jobs:
  dart-full-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Create relay secret
        run: |
          echo "KPARK_RELAY_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Start DART relay
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python dart-relay.py > dart-relay.log 2>&1 &
          echo $! > dart-relay.pid
          sleep 3

      - name: Start K-PARK Worker
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_RELAY_URL: http://127.0.0.1:8790
        run: |
          npx wrangler dev --port 8787 --var "DART_RELAY_URL:http://127.0.0.1:8790" --var "KPARK_RELAY_SECRET:$KPARK_RELAY_SECRET" > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          sleep 8

      - name: Verify cloud pipeline
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "http://127.0.0.1:8787/api/dart-test?ticker=005930"
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.loads(r.read().decode("utf-8"))
          print("PIPELINE OK", data.get("ok"))
          if not data.get("ok"):
              raise SystemExit(data)
          PY

      - name: Sync 2767 DART fundamentals to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python dart-cloud-sync.py
