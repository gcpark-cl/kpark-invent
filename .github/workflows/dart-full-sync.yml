name: K-PARK DART Full Sync

on:
  workflow_dispatch:

jobs:
  dart-full-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install K-PARK dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Create relay secret
        run: |
          echo "KPARK_RELAY_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Start DART relay
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python dart-relay.py > dart-relay.log 2>&1 &
          echo $! > dart-relay.pid
          sleep 3

      - name: Verify DART relay
        run: |
          python - <<'PY'
          import urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8790/health", timeout=10) as r:
              print("DART RELAY HEALTH", r.read().decode("utf-8"))
          PY

      - name: Verify DART relay data
        run: |
          python - <<'PY'
          import os, urllib.request
          url = "http://127.0.0.1:8790/company?corp_code=00126380"
          req = urllib.request.Request(
              url,
              headers={"x-kpark-relay-secret": os.environ["KPARK_RELAY_SECRET"]}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              print("DART RELAY DATA OK", r.read().decode("utf-8")[:300])
          PY

      - name: Start K-PARK Worker
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          printf "DART_API_KEY=%s\nDART_RELAY_URL=http://127.0.0.1:8790\nKPARK_RELAY_SECRET=%s\n" "$DART_API_KEY" "$KPARK_RELAY_SECRET" > .dev.vars
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          sleep 8

      - name: Verify cloud pipeline
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "http://127.0.0.1:8787/api/dart-test?ticker=005930"
          with urllib.request.urlopen(url, timeout=60) as r:
              data = json.loads(r.read().decode("utf-8"))
          print("PIPELINE OK", data.get("ok"))
          if not data.get("ok"):
              raise SystemExit(data)
          PY

      - name: Show pipeline logs on failure
        if: failure()
        run: |
          echo "===== WRANGLER LOG ====="
          cat wrangler.log || true
          echo "===== DART RELAY LOG ====="
          cat dart-relay.log || true

      - name: Sync 2767 DART fundamentals to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python dart-cloud-sync.py
