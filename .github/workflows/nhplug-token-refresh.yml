name: NHPLUG Token Refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests
      - name: Issue token and create SQL
        env:
          NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
        run: |
          python - <<'PY'
          import os,time,requests
          r=requests.post('https://api.nhplug.com:8443/oauth2/token',params={'appkey':os.environ['NHPLUG_APP_KEY'],'appsecretkey':os.environ['NHPLUG_APP_SECRET'],'grant_type':'client_credentials','scope':'oob'},headers={'content-type':'application/x-www-form-urlencoded'})
          r.raise_for_status()
          d=r.json(); token=d['access_token']; exp=int(time.time())+int(d.get('expires_in',86400)); now=int(time.time())
          print('::add-mask::'+token)
          esc=token.replace(chr(39),chr(39)*2)
          open('nhplug-token.sql','w').write("INSERT INTO nhplug_token_cache(id,access_token,expires_at,updated_at) VALUES('default','%s',%d,%d) ON CONFLICT(id) DO UPDATE SET access_token=excluded.access_token,expires_at=excluded.expires_at,updated_at=excluded.updated_at;"%(esc,exp,now))
          print('TOKEN_ISSUED',True)
          PY
      - name: Write token to Remote D1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute kpark --remote --file ../nhplug-token.sql

